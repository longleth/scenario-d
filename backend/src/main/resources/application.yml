spring:
  application:
    name: doc-viewer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docviewer}
    username: ${SPRING_DATASOURCE_USERNAME:docviewer}
    password: ${SPRING_DATASOURCE_PASSWORD:docviewer}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

external:
  sales-api:
    base-url: ${SALES_API_BASE_URL:http://localhost:8089/sales}
  service-api:
    base-url: ${SERVICE_API_BASE_URL:http://localhost:8089/service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.keyloop.docviewer: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{ISO8601} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"

